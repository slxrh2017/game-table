<style>

<body><div class="app">
<header><button class="back">‹ Back</button><div class="title">Game Table · 01</div><button class="headbtn" id="refresh">↻</button><button class="headbtn" id="menu">•••</button></header>
<div class="pin">📌 <span id="status">Live game · Banker bidding</span></div><div class="phase"><b id="ph">BANKER</b> · <span id="tm">5s</span></div>
<button class="newmsgs" id="newmsgs">↓ New messages</button><main class="feed" id="feed"></main>
<div class="composer" id="composer"><input id="inp" autocomplete="off" placeholder="Enter bid amount…"><button id="send">↑</button></div>
<div class="menuPanel" id="menuPanel"><button id="newRound">Restart demo round</button><button id="clearChat">Clear chat</button></div>
<div class="overlay" id="rp"><div class="rphead"><div class="avatar">🧧</div><h2>Red Packet</h2><div class="amount" id="mine">RM 0.00</div><small id="mineLabel">Your amount</small></div><div class="rpbar"><span id="rptotal">0 packets · RM 0.00</span><span id="rptimer">45s</span></div><div class="live" id="live"></div><button class="close" id="close">Return to group</button></div>
<div class="toast" id="toast"></div></div>
<script>
const $=id=>document.getElementById(id), feed=$('feed'), inp=$('inp'), send=$('send'), composer=$('composer');
const INITIAL=100000, MIN_PLAYERS=10, RAKE_PLAYER=3, RAKE_BANKER=5, NORMAL_MULT=17;
const names=['You','Player001','Player002','Player003','Player004','Player005','Player006','Player007','Player008','Player009'];
const emojis=['🙂','🦊','🐯','🐼','🦁','🐱','🐸','🐰','🐻','🐨'];
let state;
function resetState(){state={round:1001,phase:'BID',timer:5,timerId:null,players:names.map((name,i)=>({name,wallet:INITIAL,available:INITIAL,frozen:0,bet:null,active:false,emoji:emojis[i]})),bid:{highest:0,leader:null,firstSeq:0,seq:0},banker:null,originalPool:0,currentPool:0,continueUsed:false,packet:{total:0,remaining:0,amounts:{},collected:{},started:false},results:null,botTimers:[]};}
resetState();
function money(c){return (c/100).toFixed(2)}
function halfUp(n){return Math.floor(n+0.5)}
function now(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getPlayer(n){return state.players.find(p=>p.name===n)}
function isNearBottom(){return feed.scrollHeight-feed.scrollTop-feed.clientHeight<90}
function msg(html,me=false){
  const stick=isNearBottom();
  const d=document.createElement('div');d.className='msg'+(me?' me':'');
  d.innerHTML=html+'<div class="time">'+now()+'</div>';feed.appendChild(d);
  if(stick) feed.scrollTop=feed.scrollHeight;
  else $('newmsgs').classList.add('on');
}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800)}
function stopTimer(){clearInterval(state.timerId);state.timerId=null}
function setPhase(p,seconds){stopTimer();state.phase=p;state.timer=seconds;$('ph').textContent={BID:'BANKER',BET:'BETTING',CLOSED:'CLOSED',PACKET:'PACKET',RESULTS:'RESULTS',CONTINUE:'CONTINUE'}[p]||p;$('tm').textContent=seconds+'s';$('status').textContent={BID:'Live game · Banker bidding',BET:'Live game · Betting open',CLOSED:'Betting closed',PACKET:'Red Packet · Collection live',RESULTS:'Round results',CONTINUE:'Continue as Banker?'}[p]||'';const lock=['PACKET','CLOSED','RESULTS'].includes(p);composer.classList.toggle('locked',lock);inp.disabled=lock;inp.placeholder=p==='BID'?'Enter bid amount…':p==='BET'?'10 or AA10…':p==='CONTINUE'?'1 = continue · 0 = stop…':'Chat…';if(seconds>0){state.timerId=setInterval(()=>{state.timer--;if($('tm'))$('tm').textContent=state.timer+'s';if(state.phase==='PACKET'&&$('rp').classList.contains('on'))renderLive();if(state.phase==='PACKET'&&$('rptimer'))$('rptimer').textContent=state.timer+'s';if(state.timer<=0){stopTimer();advancePhase()}},1000)}}
function advancePhase(){if(state.phase==='BID')closeBidding();else if(state.phase==='BET')closeBetting();else if(state.phase==='PACKET')closePacketPhase();else if(state.phase==='CONTINUE')stopTable()}
function validBidCents(c){return c>=50000 && c%5000===0 && c>=state.bid.highest+5000}
function placeBid(name,c){const p=getPlayer(name);if(state.phase!=='BID')return {ok:false,error:'Bidding is closed.'};if(!p)return {ok:false,error:'Player not found.'};if(c>p.available)return {ok:false,error:'Insufficient available balance.'};if(!validBidCents(c))return {ok:false,error:'Bid must be at least 500.00 and at least 50.00 above the current bid.'};state.bid.seq++;state.bid.highest=c;state.bid.leader=name;state.bid.firstSeq=state.bid.seq;setPhase('BID',5);return {ok:true}}
function closeBidding(){if(state.bid.highest<=0){msg('<h3>❌ Banker bidding cancelled</h3><p>No valid Banker bid was received.</p>');stopTable();return}const p=getPlayer(state.bid.leader);state.banker=p;state.originalPool=state.bid.highest;state.currentPool=state.bid.highest;p.available-=state.bid.highest;p.frozen+=state.bid.highest;p.bet=null;p.active=true;msg('<h3>🔴 Banker bidding closed</h3><p>Banker: <b>@'+esc(p.name)+'</b></p><p>Original Banker Pool: <span class="gold">'+money(state.originalPool)+'</span></p>');startBetting()}
function normalMax(){return Math.floor(state.currentPool/12500)*100}
function aaMax(){return Math.floor(state.currentPool/2000)*100}
function placeBet(name,type,c){if(state.phase!=='BET')return {ok:false,error:'Betting is closed.'};const p=getPlayer(name);if(!p||p===state.banker)return {ok:false,error:'Banker cannot place a player bet.'};if(c===0){if(p.bet){p.available+=p.frozen;p.frozen=0;p.bet=null;p.active=false}return {ok:true,cancel:true}}const min=type==='AA'?500:100,max=type==='AA'?aaMax():normalMax();if(c<min||c>max)return {ok:false,error:type+' range is '+money(min)+' to '+money(max)+'.'};const hold=type==='AA'?c:c*NORMAL_MULT;if(p.available+p.frozen<hold)return {ok:false,error:'Insufficient available balance.'};if(p.bet){p.available+=p.frozen;p.frozen=0;p.bet=null;p.active=false}if(p.available<hold)return {ok:false,error:'Insufficient available balance.'};p.available-=hold;p.frozen=hold;p.bet={type,amount:c,hold};p.active=true;return {ok:true}}
function botBet(name,type,c){const r=placeBet(name,type,c);if(r.ok)msg('<p>🤖 @'+esc(name)+' <b>'+(type==='AA'?'AA':'')+money(c)+'</b></p>');}
function startBetting(){const maxN=money(normalMax()),maxA=money(aaMax());msg('<h3>💰 Betting started</h3><div class="rule"><div class="r"><span>Banker Pool</span><b>'+money(state.currentPool)+'</b></div><div class="r"><span>Normal</span><b>1.00 – '+maxN+'</b></div><div class="r"><span>AA</span><b>5.00 – '+maxA+'</b></div><div class="r"><span>Normal hold</span><b>Bet ×17</b></div><div class="r"><span>AA hold</span><b>Bet ×1</b></div></div><p>Type <b>10</b> for Normal 10.00. Type <b>AA10</b> for AA 10.00. Type <b>0</b> to cancel.</p>');setPhase('BET',45);state.botTimers.forEach(clearTimeout);state.botTimers=[];const bots=[['Player001','NORMAL',normalMax()],['Player002','AA',Math.min(4000,aaMax())],['Player003','NORMAL',Math.min(400,normalMax())],['Player005','NORMAL',Math.min(300,normalMax())],['Player006','NORMAL',Math.min(500,normalMax())],['Player007','NORMAL',Math.min(200,normalMax())],['Player008','AA',Math.min(500,aaMax())],['Player009','NORMAL',Math.min(600,normalMax())]];bots.forEach((b,i)=>state.botTimers.push(setTimeout(()=>{if(state.phase==='BET'&&b[2]>= (b[1]==='AA'?500:100))botBet(b[0],b[1],b[2])},800+i*650)));state.botTimers.push(setTimeout(()=>{if(state.phase==='BET')msg('<h3>⏰ 10 seconds left to bet</h3><p>Place or modify your bet now.</p>')},35000))}
function closeBetting(){
  state.botTimers.forEach(clearTimeout);state.botTimers=[];setPhase('CLOSED',0);
  const bettors=state.players.filter(p=>p.active&&p!==state.banker&&p.bet);
  const participantCount=bettors.length+1;
  const normal=bettors.filter(p=>p.bet.type==='NORMAL').reduce((a,p)=>a+p.bet.amount,0);
  const aa=bettors.filter(p=>p.bet.type==='AA').reduce((a,p)=>a+p.bet.amount,0);
  const lines=bettors.map(p=>'<div class="bet"><span>@'+esc(p.name)+'</span><b>'+(p.bet.type==='AA'?'AA':'')+money(p.bet.amount)+'</b></div>').join('');
  msg('<h3>✅ Betting closed</h3><p>No new, modified, or cancelled bets are accepted.</p>');
  msg('<h3>📋 Round betting summary</h3><div class="r"><span>Banker Pool</span><b>'+money(state.currentPool)+'</b></div><div class="r"><span>Packet amount</span><b>'+money(participantCount*100+120)+'</b></div><div class="r"><span>Packet count</span><b>'+participantCount+'</b></div><div class="r"><span>Total Normal bet</span><b>'+money(normal)+'</b></div><div class="r"><span>Total AA bet</span><b>'+money(aa)+'</b></div><div class="bets">'+lines+'</div>');
  startPacket();
}
function randomAllocation(total,n){
  if(n<=0)return [];
  const min=1, naturalCap=Math.floor(total*0.25);
  const cap=Math.max(naturalCap,Math.ceil(total/n));
  const vals=Array(n).fill(min);
  let remaining=total-n;
  while(remaining>0){
    const eligible=[];
    for(let i=0;i<n;i++){
      if(vals[i]<cap && remaining-1 >= (n-1)*min) eligible.push(i);
    }
    if(!eligible.length)break;
    const i=eligible[Math.floor(Math.random()*eligible.length)];
    const maxAdd=Math.min(cap-vals[i],remaining-(n-1)*min);
    const add=maxAdd<=1?maxAdd:1+Math.floor(Math.random()*maxAdd);
    vals[i]+=add;remaining-=add;
  }
  if(remaining>0){
    for(let i=0;i<n&&remaining>0;i++){
      const add=Math.min(cap-vals[i],remaining);vals[i]+=add;remaining-=add;
    }
  }
  if(remaining>0)vals[n-1]+=remaining;
  return vals;
}
function startPacket(){
  const active=state.players.filter(p=>p.active);
  const total=active.length*100+120;
  state.packet={total,remaining:total,amounts:{},collected:{},started:true};
  active.forEach(p=>state.packet.collected[p.name]=false);
  msg('<div class="packet" id="packetCard"><div class="pt">🧧 <b>Red Packet</b></div><div class="pb">Tap to collect and view live collection</div></div>');
  $('packetCard').onclick=()=>openPacket();
  setPhase('PACKET',45);
  scheduleBotCollections(active.filter(p=>p.name!=='You'));
}
function packetCap(){
  const n=Object.keys(state.packet.collected).length;
  return Math.max(Math.floor(state.packet.total*0.25),Math.ceil(state.packet.total/Math.max(1,n)));
}
function choosePacketAmount(name){
  const uncollected=state.players.filter(p=>p.active&&!state.packet.collected[p.name]);
  const n=uncollected.length;
  if(n<=0||!uncollected.some(p=>p.name===name))return 0;
  if(n===1)return state.packet.remaining;
  const min=1,cap=packetCap();
  const max=Math.min(cap,state.packet.remaining-(n-1)*min);
  if(max<min)return 0;
  return min+Math.floor(Math.random()*(max-min+1));
}
function collect(name){
  if(state.phase!=='PACKET'||state.packet.collected[name])return state.packet.amounts[name]||0;
  const amount=choosePacketAmount(name);
  if(amount<=0)return 0;
  state.packet.amounts[name]=amount;
  state.packet.collected[name]=true;
  state.packet.remaining-=amount;
  return amount;
}
function scheduleBotCollections(bots){
  bots.forEach((p,i)=>{
    state.botTimers.push(setTimeout(()=>{
      if(state.phase==='PACKET'&&!state.packet.collected[p.name]){
        collect(p.name);
        if($('rp').classList.contains('on'))renderLive();
      }
    },1200+i*1800));
  });
}
function openPacket(){
  if(state.phase!=='PACKET'&&state.phase!=='RESULTS')return;
  const me=collect('You');
  $('rp').classList.add('on');
  $('mine').textContent=me?'RM '+money(me):(state.packet.collected.You?'RM '+money(state.packet.amounts.You):'Not collected');
  $('mineLabel').textContent=state.packet.collected.You?'You received':'Waiting to collect';
  renderLive();
}
function renderLive(){
  const active=state.players.filter(p=>p.active);
  $('live').innerHTML=active.map(p=>{
    const c=state.packet.collected[p.name],a=state.packet.amounts[p.name];
    return '<div class="li"><div class="ava">'+p.emoji+'</div><div class="who"><b>'+esc(p.name)+(p===state.banker?' · Banker':'')+'</b><small>'+(c?'Collected':'Waiting')+'</small></div><div class="amt">'+(c?'RM '+money(a):'<span class="hiddenAmt">••••</span>')+'</div></div>';
  }).join('')||'<div class="empty">No active participants.</div>';
  $('rptimer').textContent=state.phase==='PACKET'?state.timer+'s':'Collection ended';
  $('rptotal').textContent=active.length+' packets · RM '+money(state.packet.total);
}
function closePacketPhase(){
  state.botTimers.forEach(clearTimeout);state.botTimers=[];
  const eligible=state.players.filter(p=>p.active&&!state.packet.collected[p.name]);
  if(eligible.length){
    const allocations=randomAllocation(state.packet.remaining,eligible.length);
    eligible.forEach((p,i)=>{
      state.packet.amounts[p.name]=allocations[i];
      state.packet.collected[p.name]=true;
    });
    state.packet.remaining=0;
  }
  $('rp').classList.remove('on');
  msg('<h3>⏳ Collecting ended</h3><p>The Red Packet is closed. Tallying results…</p>');
  setTimeout(settle,500);
}

function evalPacket(c){
  if(c===1)return{cat:'SPECIAL',rank:100,score:100,amount:c,label:'0.01 Special'};
  const dollars=Math.floor(c/100),d1=Math.floor((c%100)/10),d2=c%10;
  if(dollars>=1&&dollars<=9&&dollars===d1&&d1===d2)
    return{cat:'TRIPLE',rank:7,score:dollars,amount:c,label:'Triple'};
  if(c%100===0&&dollars>=1&&dollars<=9)
    return{cat:'FULL',rank:6,score:dollars,amount:c,label:'Full'};
  const reverse=[98,987,876,765,654,543,432,321,210];
  const straight=[12,123,234,345,456,567,678,789];
  if(reverse.includes(c))return{cat:'REVERSE_STRAIGHT',rank:5,score:c,amount:c,label:'Reverse Straight'};
  if(straight.includes(c))return{cat:'STRAIGHT',rank:4,score:c,amount:c,label:'Straight'};
  if(d1===d2&&d1>=1&&d1<=9)
    return{cat:'PAIR',rank:3,score:d1,amount:c,label:'Pair'};
  if(c>=10&&c<=90&&c%10===0)
    return{cat:'GOLDEN',rank:2,score:d1,amount:c,label:'Golden'};
  let score=(dollars+d1+d2)%10;if(score===0)score=10;
  return{cat:'REGULAR',rank:1,score,amount:c,label:'Regular '+score};
}
function compareHands(a,b){if(a.cat==='SPECIAL'||b.cat==='SPECIAL')return a.cat==='SPECIAL'&&b.cat==='SPECIAL'?0:(a.cat==='SPECIAL'?1:-1);if(a.rank!==b.rank)return a.rank-b.rank;if(a.score!==b.score)return a.score-b.score;return a.amount-b.amount}
function playerOutcome(p,bh,ph){if(ph.cat==='SPECIAL'||bh.cat==='SPECIAL')return ph.cat==='SPECIAL'&&bh.cat==='SPECIAL'?'TIE':ph.cat==='SPECIAL'?'WIN':'LOSE';const cmp=compareHands(ph,bh);return cmp>0?'WIN':cmp<0?'LOSE':'TIE'}
function settle(){
  const banker=state.banker;
  const bh=evalPacket(state.packet.amounts[banker.name]||1);
  const active=state.players.filter(p=>p.active&&p!==banker&&p.bet);
  const playerData=active.map(p=>{
    const packet=state.packet.amounts[p.name]||1,hand=evalPacket(packet);
    return{p,packet,hand,outcome:playerOutcome(p,bh,hand),gross:0,rake:0,net:0,loss:0};
  });
  let pool=state.currentPool,losses=0;
  for(const d of playerData){
    if(d.outcome==='LOSE'){
      const loss=d.p.bet.type==='AA'?d.p.bet.amount:d.p.bet.amount*dhandMult(bh);
      d.loss=Math.min(loss,d.p.bet.hold);losses+=d.loss;pool+=d.loss;
    }
  }
  const winners=playerData.filter(d=>d.outcome==='WIN').sort((a,b)=>compareHands(b.hand,a.hand)||b.packet-a.packet);
  let payouts=0,cutoff=false;
  for(const d of winners){
    const gross=d.p.bet.type==='AA'?d.p.bet.amount:d.p.bet.amount*dhandMult(d.hand);
    if(cutoff||gross>pool){
      d.outcome='TIE';d.gross=0;d.rake=0;d.net=0;d.loss=0;cutoff=true;continue;
    }
    d.gross=gross;d.rake=halfUp(gross*3/100);d.net=gross-d.rake;
    payouts+=gross;pool-=gross;
  }
  for(const d of playerData){
    if(d.outcome==='LOSE'){d.p.frozen=0;d.p.available+=d.p.bet.hold-d.loss}
    else if(d.outcome==='WIN'){d.p.frozen=0;d.p.available+=d.p.bet.hold+d.net}
    else{d.p.frozen=0;d.p.available+=d.p.bet.hold}
  }
  const bankerGross=losses-payouts;
  const bankerRake=bankerGross>0?halfUp(bankerGross*5/100):0;
  pool-=bankerRake;
  state.currentPool=Math.max(0,pool);
  banker.frozen=state.currentPool;
  const bankerNet=state.currentPool-state.originalPool;
  state.results={banker,bh,players:playerData,losses,payouts,bankerGross,bankerRake,bankerNet};
  showResults();
}
function dhandMult(hand){return hand.cat==='TRIPLE'?17:hand.cat==='FULL'?15:hand.cat==='REVERSE_STRAIGHT'?14:hand.cat==='STRAIGHT'?13:hand.cat==='PAIR'?12:hand.cat==='GOLDEN'?11:hand.score}
function showResults(){
  setPhase('RESULTS',0);
  const r=state.results;
  let html='<h3>🏆 Round #'+state.round+' — Full Results</h3><div class="rule"><p><b>🏦 Banker @'+esc(r.banker.name)+'</b></p><div class="r"><span>Packet</span><b>'+money(r.bh.amount)+'</b></div><div class="r"><span>Hand</span><b>'+r.bh.label+'</b></div><div class="r"><span>Banker Pool</span><b>'+money(state.currentPool)+'</b></div><div class="r"><span>Player losses</span><b>+'+money(r.losses)+'</b></div><div class="r"><span>Player payouts</span><b>-'+money(r.payouts)+'</b></div><div class="r"><span>Banker net result</span><b class="'+(r.bankerNet>=0?'green':'red')+'">'+(r.bankerNet>=0?'+':'')+money(r.bankerNet)+'</b></div><div class="r"><span>Banker total balance</span><b>'+money(r.banker.available+r.banker.frozen)+'</b></div></div>';
  msg(html);
  const rows=r.players.map(d=>'<div class="result '+(d.outcome==='WIN'?'win':d.outcome==='LOSE'?'lose':'tie')+'"><b>@'+esc(d.p.name)+'</b><p>Packet '+money(d.packet)+' · '+d.hand.label+'</p><p>Bet '+(d.p.bet.type==='AA'?'AA':'')+money(d.p.bet.amount)+' → <span class="'+(d.outcome==='WIN'?'green':d.outcome==='LOSE'?'red':'gold')+'">'+d.outcome+(d.outcome==='WIN'?' +'+money(d.net):d.outcome==='LOSE'?' -'+money(d.loss):' 0.00')+'</span></p><p>Updated balance: '+money(d.p.available+d.p.frozen)+'</p></div>').join('');
  msg('<h3>👥 Player results</h3>'+rows);
  if(state.continueUsed){
    msg('<h3>🎩 Banker continuation completed</h3><p>The Banker has already continued once.</p><p><b>Round over.</b> A new Banker bidding process will now begin.</p>');
    setTimeout(()=>newBiddingRound(),700);
  }else{
    const min=state.originalPool,max=state.originalPool+Math.max(0,r.bankerNet);
    msg('<h3>🎩 Continue as Banker?</h3><p>@'+esc(r.banker.name)+'</p><p>Stake range: <span class="gold">'+money(min)+' – '+money(max)+'</span></p><p>Continue is available once per table. Reply within <b>90s</b>: <b>1</b> = continue at maximum · <b>0</b> = stop · or enter an amount within the range.</p>');
    setPhase('CONTINUE',90);
  }
}
function startContinuationRound(){
  stopTimer();
  state.phase='BET';
  state.bid={highest:0,leader:null,firstSeq:0,seq:0};
  state.results=null;
  state.players.forEach(p=>{p.bet=null;if(p!==state.banker){p.active=false;p.frozen=0}});
  state.banker.active=true;
  state.currentPool=state.originalPool;
  msg('<div class="roundmark">🔄 <b>Round #'+state.round+' · Continued Banker round</b></div>');
  msg('<h3>💰 Betting started</h3><div class="rule"><div class="r"><span>Banker Pool</span><b>'+money(state.currentPool)+'</b></div><div class="r"><span>Normal</span><b>1.00 – '+money(Math.floor(state.currentPool/12500)*100)+'</b></div><div class="r"><span>AA</span><b>5.00 – '+money(Math.floor(state.currentPool/2000)*100)+'</b></div><div class="r"><span>Normal hold</span><b>×17</b></div><div class="r"><span>AA hold</span><b>×1</b></div></div><p>Type <b>10</b> for Normal 10.00, <b>AA10</b> for AA 10.00. Type <b>0</b> to cancel.</p>');
  setPhase('BET',45);
  demoContinuationBets();
}
function demoContinuationBets(){
  const bets=[['Player001','NORMAL',600],['Player002','AA',4000],['Player003','NORMAL',400],['Player005','NORMAL',300],['Player006','NORMAL',500],['Player007','NORMAL',200],['Player008','AA',500],['Player009','NORMAL',600]];
  state.botTimers=[];
  bets.forEach((b,i)=>state.botTimers.push(setTimeout(()=>{if(state.phase==='BET'){const r=placeBet(b[0],b[1],b[2]);if(r.ok)msg('<p>🤖 @'+b[0]+' '+(b[1]==='AA'?'AA':'')+money(b[2])+'</p>')}},500+i*650)));
  state.botTimers.push(setTimeout(()=>{if(state.phase==='BET')msg('<h3>⏰ 10 seconds left to bet</h3><p>Place or modify your bet now.</p>')},35000));
}
function continueBanker(amount){
  if(state.continueUsed)return{ok:false,error:'The Banker has already continued once at this table.'};
  const b=state.banker,r=state.results;
  const min=state.originalPool,max=state.originalPool+Math.max(0,r.bankerNet);
  if(amount<min||amount>max)return{ok:false,error:'Continuation stake must be between '+money(min)+' and '+money(max)+'.'};
  if(amount>b.available+b.frozen)return{ok:false,error:'Insufficient balance for continuation.'};
  b.available+=b.frozen;b.frozen=0;b.available-=amount;b.frozen=amount;
  state.originalPool=amount;state.currentPool=amount;state.continueUsed=true;state.continuedRound=true;
  state.players.forEach(p=>{if(p!==b){p.bet=null;p.active=false;p.frozen=0}});
  b.bet=null;b.active=true;
  return{ok:true};
}
function retainLastRounds(){
  const markers=[...feed.querySelectorAll('.roundmark')];
  if(markers.length<=4)return;
  const keepFrom=markers[markers.length-4];
  let n=feed.firstElementChild;
  while(n && n!==keepFrom){const next=n.nextElementSibling;n.remove();n=next;}
}
function newBiddingRound(){
  stopTimer();state.phase='BID';state.bid={highest:0,leader:null,firstSeq:0,seq:0};state.results=null;
  state.players.forEach(p=>{p.bet=null;p.active=false;p.frozen=0});
  state.banker=null;state.originalPool=0;state.currentPool=0;state.packet={total:0,remaining:0,amounts:{},collected:{},started:false};
  state.continueUsed=false;state.continuedRound=false;
  state.round++;
  msg('<h3>🔄 Round over</h3><p>The Banker has already continued once. <b>Round over.</b></p><p>A new Banker bidding process is starting.</p>');
  startRound();
}

function stopTable(){stopTimer();if(state.banker){state.banker.available+=state.banker.frozen;state.banker.frozen=0}msg('<h3>🛑 Table ended</h3><p>The Banker has stopped the table. A new round will begin with Banker bidding.</p>');setTimeout(()=>newRound(),900)}
function newRound(){state.botTimers.forEach(clearTimeout);resetState();feed.innerHTML='<div class="day"><span>Today · Round #'+state.round+'</span></div>';startRound()}
function startRound(){if(state.players.length<MIN_PLAYERS){msg('<h3>❌ Round cancelled</h3><p>At least 10 total players including the Banker are required.</p>');return}msg('<div class="roundmark">📅 <b>Round #'+state.round+'</b></div>');msg('<h3>🏦 Banker bidding started</h3><p>Minimum bid: <span class="gold">500.00</span></p><p>Each qualifying higher bid: <span class="gold">+50.00</span> minimum.</p><p>⏱️ 5 seconds to close after the latest qualifying bid. A higher qualifying bid resets the timer.</p>');retainLastRounds();setPhase('BID',5);demoBids()}
function demoBids(){const bids=[['Player004',50000],['Player005',55000],['Player004',60000],['Player006',65000],['Player004',70000],['Player007',75000],['Player004',80000]];state.botTimers=[];bids.forEach((b,i)=>state.botTimers.push(setTimeout(()=>{if(state.phase==='BID'){const r=placeBid(b[0],b[1]);if(r.ok)msg('<p>🏦 @'+b[0]+' bids <b>'+money(b[1])+'</b></p>')}},700+i*650)))}
function sendIt(){
  const raw=inp.value.trim();if(!raw)return;
  if(['PACKET','CLOSED','RESULTS'].includes(state.phase)){toast('Chat input is locked during this phase.');return}
  msg('<p>'+esc(raw)+'</p>',true);inp.value='';
  if(state.phase==='BID'){
    const v=Number(raw);
    if(!Number.isFinite(v)||!Number.isInteger(v*100)){toast('Enter a valid bid amount.');return}
    const r=placeBid('You',Math.round(v*100));
    if(!r.ok)toast(r.error);else msg('<p>🏦 Your bid of <b>'+money(Math.round(v*100))+'</b> is leading. Countdown reset to 5s.</p>');
  }else if(state.phase==='BET'){
    const aa=/^AA(\d+(?:\.\d{1,2})?)$/i.exec(raw),normal=/^(\d+(?:\.\d{1,2})?)$/.exec(raw);
    if(!aa&&!normal){toast('Use 10 for Normal or AA10 for AA.');return}
    const type=aa?'AA':'NORMAL',v=Number(aa?aa[1]:normal[1]),c=Math.round(v*100);
    const r=placeBet('You',type,c);
    if(!r.ok)toast(r.error);else msg(r.cancel?'<p>❎ Your bet was cancelled.</p>':'<p>✅ Your '+type+' bet is locked at <b>'+money(c)+'</b>.</p>');
  }else if(state.phase==='CONTINUE'){
    if(state.banker!==getPlayer('You')){toast('Only the Banker can choose continuation.');return}
    const previousOriginal=state.originalPool,max=previousOriginal+Math.max(0,state.results.bankerNet);
    if(raw==='1'){
      const r=continueBanker(max);
      if(!r.ok)toast(r.error);else{state.phase='TRANSITION';inp.disabled=true;msg('<p>🎩 Banker confirmed to continue at <b>'+money(max)+'</b>.</p>');state.round++;setTimeout(()=>startContinuationRound(),700)}
    }else if(raw==='0'){stopTable()}
    else{
      const v=Number(raw);if(!Number.isFinite(v)){toast('Enter 1, 0, or a valid stake.');return}
      const r=continueBanker(Math.round(v*100));
      if(!r.ok)toast(r.error);else{state.phase='TRANSITION';inp.disabled=true;msg('<p>🎩 Banker continuation stake set to <b>'+money(Math.round(v*100))+'</b>.</p>');state.round++;setTimeout(()=>startContinuationRound(),700)}
    }
  }else toast('Chat is locked during this phase.');
}
$('newmsgs').onclick=()=>{feed.scrollTop=feed.scrollHeight;$('newmsgs').classList.remove('on')};feed.addEventListener('scroll',()=>{if(isNearBottom())$('newmsgs').classList.remove('on')});$('send').onclick=sendIt;inp.onkeydown=e=>{if(e.key==='Enter')sendIt()};$('close').onclick=()=>$('rp').classList.remove('on');$('refresh').onclick=()=>{renderLive();toast('Live state refreshed')};$('menu').onclick=()=>$('menuPanel').classList.toggle('on');$('newRound').onclick=()=>{ $('menuPanel').classList.remove('on');newRound()};$('clearChat').onclick=()=>{feed.innerHTML='<div class="day"><span>Chat cleared · Round #'+state.round+'</span></div>';toast('Chat cleared')};
startRound();
</script></body></html>
